name: CI → Security → Deploy

on:
  push:
    branches: [master, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for Docker images (e.g. 1.2.3)'
        required: true
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: ${{ secrets.NODE_VERSION }}
  REGISTRY: ghcr.io

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ================================
  # FRONTEND
  # ================================
  frontend:
    name: Frontend – Build, Tests & Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci -w frontend

      - name: Build
        run: npm run build -w frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

#      - name: Test
#        run: npm test -w frontend -- --ci

      - name: NPM audit
        working-directory: frontend
        run: npm audit --audit-level=high

  # ================================
  # BACKEND
  # ================================
  backend:
    name: Backend – Build, Tests & Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci -w backend

      - name: Build
        run: npm run build -w backend

#      - name: Test
#        run: npm test -w backend -- --ci

      - name: NPM audit
        working-directory: backend
        run: npm audit --audit-level=high

  # ================================
  # DOCKER
  # ================================
  docker-frontend:
    name: Docker – Frontend
    needs: [frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hemelvaartbingo-frontend:${{ inputs.version }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

  docker-backend:
    name: Docker – Backend
    needs: [backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hemelvaartbingo-backend:${{ inputs.version }}

  # ================================
  # DEPLOY
  # ================================
  deploy-dev:
    name: Deploy to Portainer Dev
    needs: [docker-frontend, docker-backend]
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    permissions:
      contents: read
    environment:
      name: dev
    steps:
      - name: Trigger Portainer Webhook
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

      - name: Wait for deployment
        run: sleep 30

      - name: Verify service is running
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.DEPLOY_HEALTHCHECK_URL }}")
            if [ "$STATUS" = "200" ]; then
              echo "Service is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Service failed health check"
          exit 1

  deploy-prod:
    name: Deploy to Portainer Prod
    needs: [docker-frontend, docker-backend]
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - name: Trigger Portainer Webhook
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

      - name: Wait for deployment
        run: sleep 30

      - name: Verify service is running
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.DEPLOY_HEALTHCHECK_URL }}")
            if [ "$STATUS" = "200" ]; then
              echo "Service is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Service failed health check"
          exit 1
