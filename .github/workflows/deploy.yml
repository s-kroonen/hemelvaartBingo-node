name: Deploy

on:
  push:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for Docker images (e.g. 1.2.3)'
        required: true
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Every deploy runs the full CI first; images and deploys only start when it passes.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      security-events: write
      actions: read

  # ================================
  # DOCKER
  # ================================
  docker-frontend:
    name: Docker – Frontend
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hemelvaartbingo-frontend:${{ inputs.version }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

  docker-backend:
    name: Docker – Backend
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hemelvaartbingo-backend:${{ inputs.version }}

  # ================================
  # DEPLOY
  # ================================
  deploy-dev:
    name: Deploy to Portainer Dev
    needs: [docker-frontend, docker-backend]
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    permissions:
      contents: read
    environment:
      name: dev
    steps:
      - name: Trigger Portainer Webhook
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

      - name: Wait for deployment
        run: sleep 30

      - name: Verify service is running
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.DEPLOY_HEALTHCHECK_URL }}")
            if [ "$STATUS" = "200" ]; then
              echo "Service is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Service failed health check"
          exit 1

  deploy-prod:
    name: Deploy to Portainer Prod
    needs: [docker-frontend, docker-backend]
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - name: Trigger Portainer Webhook
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

      - name: Wait for deployment
        run: sleep 30

      - name: Verify service is running
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.DEPLOY_HEALTHCHECK_URL }}")
            if [ "$STATUS" = "200" ]; then
              echo "Service is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Service failed health check"
          exit 1
