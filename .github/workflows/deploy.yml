name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for Docker images (e.g. 1.2.3)'
        required: true
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  # dev never cancels a run that is waiting on a deploy: the deploy goes on in the orchestrator
  # and the next push would only be refused as busy. main keeps cancelling for now.
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

env:
  REGISTRY: ghcr.io

jobs:
  # Every deploy runs the full CI first; images and deploys only start when it passes.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      security-events: write
      actions: read

  # ================================
  # DOCKER
  # ================================
  docker-frontend:
    name: Docker – Frontend
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hemelvaartbingo-frontend:${{ inputs.version }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

  docker-backend:
    name: Docker – Backend
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hemelvaartbingo-backend:${{ inputs.version }}

  # ================================
  # DEPLOY
  # ================================
  deploy-dev:
    # Through the Homelab Orchestrator: probes before, the Mongo dump and images of the last
    # 3 versions kept, probes again after. The job fails with the orchestrator's reason.
    name: Deploy dev (orchestrator)
    needs: [docker-frontend, docker-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    permissions:
      contents: read
    environment:
      name: dev
      url: https://devbingo.kroon-en.nl
    steps:
      - name: Deploy hemelvaart-bingo-node-dev through the orchestrator
        env:
          DEPLOY_URL: https://orchestrator.kroon-en.nl/hooks/deploy/hemelvaart-bingo-node-dev
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_HEMELVAART_BINGO_NODE_DEV }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -u
          fail() { echo "::error title=Deploy of hemelvaart-bingo-node-dev failed::$1"; exit 1; }

          [ -n "${DEPLOY_KEY:-}" ] || fail "The key is empty: add the secret DEPLOY_KEY_HEMELVAART_BINGO_NODE_DEV to the dev environment."
          body=$(jq -nc --arg ref "$REF" --arg sha "$SHA" --arg pusher "$ACTOR" '{ref: $ref, sha: $sha, pusher: $pusher}')

          # 1. Ask the orchestrator to deploy.
          code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 30 -X POST "$DEPLOY_URL" \
            -H "Authorization: Bearer $DEPLOY_KEY" -H 'X-Deploy-Source: github-actions' \
            -H 'Content-Type: application/json' -d "$body") \
            || fail "Could not reach the orchestrator at $DEPLOY_URL (down, wrong URL, or not reachable from this runner)."
          why=$(jq -r '.detail // empty' resp.json 2>/dev/null || true)
          case "$code" in
            202) ;;
            401) fail "The orchestrator rejected the key (401). DEPLOY_KEY_HEMELVAART_BINGO_NODE_DEV must be this service's current key; it changes when the key is replaced." ;;
            404) fail "The orchestrator has no deploy webhook for hemelvaart-bingo-node-dev (404): switch the webhook on for this service." ;;
            409) fail "The orchestrator refused to deploy (409): ${why:-busy or deploys switched off}" ;;
            423) fail "hemelvaart-bingo-node-dev is switched off in the orchestrator (423): switch it on first." ;;
            5??) fail "The orchestrator failed ($code): ${why:-$(head -c 300 resp.json)}" ;;
            *)   fail "Unexpected answer $code from the orchestrator: $(head -c 300 resp.json)" ;;
          esac
          if [ "$(jq -r '.started' resp.json)" != "true" ]; then
            echo "Nothing to deploy: $(jq -r '.ignored // "acknowledged"' resp.json)"
            exit 0
          fi
          run=$(jq -r '.run_id' resp.json)
          echo "Deploy run #$run started."

          # 2. Wait for the result; the guards and health checks take a while.
          bad=0; waited=0
          while [ "$waited" -lt 1800 ]; do
            sleep 10; waited=$((waited + 10))
            if ! code=$(curl -sS -o run.json -w '%{http_code}' --max-time 20 \
                -H "Authorization: Bearer $DEPLOY_KEY" "$DEPLOY_URL/runs/$run"); then
              code=000
            fi
            if [ "$code" != 200 ]; then
              bad=$((bad + 1))
              [ "$bad" -lt 6 ] && { echo "Status check answered $code ($bad/6), retrying."; continue; }
              fail "Lost contact with the orchestrator while the deploy ran (last answer $code). Check run #$run there."
            fi
            bad=0
            case "$(jq -r '.status' run.json)" in
              running)   echo "  still running: $(jq -r '[.steps[]?.name] | last // "starting"' run.json)" ;;
              succeeded) echo "Deployed and healthy."; exit 0 ;;
              skipped)   fail "Blocked before anything changed: $(jq -r '.error // "a guard said no"' run.json)" ;;
              *)         fail "The deploy failed: $(jq -r --arg run "$run" '.error // "see run #\($run) in the orchestrator"' run.json). Failed steps: $(jq -r '[.steps[]? | select(.status == "failed") | .name + (if .message != "" then " (" + .message + ")" else "" end)] | join("; ")' run.json)" ;;
            esac
          done
          fail "Gave up waiting after 30 minutes. The deploy (run #$run) may still be running in the orchestrator."

  deploy-prod:
    name: Deploy to Portainer Prod
    needs: [docker-frontend, docker-backend]
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - name: Trigger Portainer Webhook
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

      - name: Wait for deployment
        run: sleep 30

      - name: Verify service is running
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.DEPLOY_HEALTHCHECK_URL }}")
            if [ "$STATUS" = "200" ]; then
              echo "Service is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Service failed health check"
          exit 1
